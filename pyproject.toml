[project]
name = "research-global-health"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kholodkova", email = "chernyshova.jess@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
rg = "research_global_health.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
]
dev = [
    {include-group = "analysis"},
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-openpyxl>=3.1.5.20260827",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=research_global_health --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["src/research_global_health"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
